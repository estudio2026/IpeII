<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevPortfolio · Álvaro García</title>
  <meta name="description" content="Portfolio personal de Álvaro García, desarrollador DAM. Proyectos, habilidades y contacto.">
  
  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    /* ============================================
       RESET Y VARIABLES
       ============================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0a0e14;
      --bg-card: #121821;
      --bg-card-hover: #182030;
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.4);
      --secondary: #a78bfa;
      --accent: #34d399;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --border: rgba(255, 255, 255, 0.06);
      --border-hover: rgba(56, 189, 248, 0.35);
      --shadow-card: 0 4px 20px -4px rgba(0, 0, 0, 0.5);
      --shadow-hover: 0 20px 40px -12px rgba(0, 0, 0, 0.7);
      --radius: 18px;
      --radius-sm: 12px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 2rem;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(56, 189, 248, 0.07) 0%, transparent 30%),
        radial-gradient(circle at 85% 60%, rgba(167, 139, 250, 0.07) 0%, transparent 35%),
        radial-gradient(circle at 50% 100%, rgba(52, 211, 153, 0.05) 0%, transparent 40%);
      background-attachment: fixed;
    }

    ::selection {
      background: var(--primary);
      color: var(--bg-dark);
    }

    /* Scrollbar personalizado */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-dark);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 10px;
    }

    /* ============================================
       ANIMACIONES GLOBALES
       ============================================ */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); }
      50% { box-shadow: 0 0 35px rgba(56, 189, 248, 0.45); }
    }

    @keyframes shimmer {
      0% { background-position: -1000px 0; }
      100% { background-position: 1000px 0; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Utilidad para revelar al hacer scroll */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* ============================================
       LAYOUT PRINCIPAL
       ============================================ */
    .container {
      max-width: 1150px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* ============================================
       NAVBAR
       ============================================ */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 1rem 0;
      background: rgba(10, 14, 20, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid transparent;
      transition: var(--transition);
    }

    .navbar.scrolled {
      border-bottom-color: var(--border);
      padding: 0.7rem 0;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }

    .nav-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-main);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-logo span {
      color: var(--primary);
    }

    .nav-logo .cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: var(--primary);
      margin-left: 2px;
      animation: blink 1s step-end infinite;
      vertical-align: middle;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
      align-items: center;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      position: relative;
      transition: var(--transition);
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--primary);
      transition: width var(--transition);
      border-radius: 2px;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.3rem;
    }

    /* ============================================
       HERO SECTION
       ============================================ */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 6rem 0 4rem;
      position: relative;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
      width: 100%;
    }

    .hero-text {
      animation: fadeInUp 0.8s ease both;
    }

    .hero-status {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.3);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.4rem 1rem;
      border-radius: 50px;
      margin-bottom: 1.5rem;
      letter-spacing: 0.3px;
    }

    .hero-status .dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent);
      animation: pulseGlow 2s infinite;
    }

    .hero h1 {
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
    }

    .hero h1 .gradient {
      background: linear-gradient(120deg, var(--primary), var(--secondary), var(--accent));
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gradientShift 5s ease infinite;
    }

    .hero-subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      color: var(--primary);
      margin-bottom: 1.5rem;
      min-height: 1.6em;
    }

    .hero-subtitle .type-cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: var(--primary);
      margin-left: 3px;
      animation: blink 1s step-end infinite;
      vertical-align: middle;
    }

    .hero-description {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 500px;
      margin-bottom: 2rem;
    }

    .hero-cta {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 1.7rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.92rem;
      text-decoration: none;
      transition: var(--transition);
      border: 1px solid transparent;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--primary);
      color: var(--bg-dark);
      box-shadow: 0 8px 20px -6px var(--primary-glow);
    }

    .btn-primary:hover {
      background: #7dd3fc;
      transform: translateY(-3px);
      box-shadow: 0 15px 30px -8px var(--primary-glow);
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    .btn-ghost:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(56, 189, 248, 0.05);
      transform: translateY(-3px);
    }

    /* Hero visual - code window */
    .hero-visual {
      animation: fadeInUp 0.8s 0.2s ease both;
      perspective: 1000px;
    }

    .code-window {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-card), 0 0 60px -20px var(--primary-glow);
      transform: rotateY(-5deg) rotateX(2deg);
      transition: var(--transition);
      animation: float 6s ease-in-out infinite;
    }

    .code-window:hover {
      transform: rotateY(0) rotateX(0) translateY(-5px);
      box-shadow: var(--shadow-hover), 0 0 80px -20px var(--primary-glow);
    }

    .window-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1rem;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid var(--border);
    }

    .window-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }

    .window-title {
      margin-left: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .window-body {
      padding: 1.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      line-height: 1.8;
      overflow-x: auto;
    }

    .code-line {
      display: block;
      white-space: pre;
    }

    .code-keyword { color: #c084fc; }
    .code-string { color: #86efac; }
    .code-function { color: #38bdf8; }
    .code-comment { color: #64748b; font-style: italic; }
    .code-var { color: #fbbf24; }
    .code-bracket { color: #94a3b8; }
    .code-bool { color: #f472b6; }

    /* ============================================
       SECCIONES GENÉRICAS
       ============================================ */
    section {
      padding: 5rem 0;
    }

    .section-header {
      text-align: center;
      margin-bottom: 3.5rem;
    }

    .section-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--primary);
      margin-bottom: 0.8rem;
      display: block;
      letter-spacing: 1px;
    }

    .section-title {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }

    .section-desc {
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto;
      font-size: 1rem;
    }

    .section-line {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      margin: 1.2rem auto 0;
      border-radius: 3px;
    }

    /* ============================================
       SOBRE MÍ
       ============================================ */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 4rem;
      align-items: center;
    }

    .about-avatar {
      display: flex;
      justify-content: center;
      position: relative;
    }

    .avatar-frame {
      width: 240px;
      height: 240px;
      border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
      background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      animation: float 7s ease-in-out infinite;
      box-shadow: 0 20px 60px -15px var(--primary-glow);
      position: relative;
    }

    .avatar-frame::before {
      content: '';
      position: absolute;
      inset: 6px;
      background: var(--bg-card);
      border-radius: inherit;
    }

    .avatar-frame i {
      font-size: 6rem;
      color: var(--primary);
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 0 15px var(--primary-glow));
    }

    .about-text h3 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .about-text h3 span {
      color: var(--primary);
    }

    .about-text p {
      color: var(--text-muted);
      margin-bottom: 1.2rem;
      font-size: 1rem;
    }

    .about-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin-top: 1.8rem;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: var(--transition);
    }

    .info-item:hover {
      border-color: var(--border-hover);
      transform: translateY(-3px);
    }

    .info-item i {
      color: var(--primary);
      font-size: 1.2rem;
      width: 24px;
      text-align: center;
    }

    .info-item .info-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      display: block;
    }

    .info-item .info-value {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
    }

    /* ============================================
       SKILLS
       ============================================ */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1.2rem;
    }

    .skill-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.8rem 1.2rem;
      text-align: center;
      transition: var(--transition);
      cursor: default;
      position: relative;
      overflow: hidden;
    }

    .skill-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.08), transparent);
      transition: left 0.6s ease;
    }

    .skill-card:hover::before {
      left: 100%;
    }

    .skill-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-6px);
      box-shadow: var(--shadow-hover);
    }

    .skill-card i {
      font-size: 2.6rem;
      margin-bottom: 0.9rem;
      color: var(--primary);
      transition: var(--transition);
    }

    .skill-card:hover i {
      transform: scale(1.15) rotate(-5deg);
      color: var(--secondary);
    }

    .skill-card .skill-name {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 0.6rem;
    }

    .skill-bar {
      height: 5px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 0.8rem;
    }

    .skill-bar-fill {
      height: 100%;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      width: 0;
      transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ============================================
       PROYECTOS (GitHub API)
       ============================================ */
    .github-stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 0.5rem 1.2rem;
      border-radius: 50px;
      font-size: 0.85rem;
      color: var(--text-muted);
      transition: var(--transition);
    }

    .stat-pill i {
      color: var(--primary);
    }

    .stat-pill strong {
      color: var(--text-main);
    }

    .stat-pill:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.6rem;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .project-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform var(--transition);
    }

    .project-card:hover::after {
      transform: scaleX(1);
    }

    .project-card:hover {
      border-color: var(--border-hover);
      background: var(--bg-card-hover);
      transform: translateY(-6px);
      box-shadow: var(--shadow-hover);
    }

    .project-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .project-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-size: 1.3rem;
    }

    .project-links {
      display: flex;
      gap: 0.5rem;
    }

    .project-links a {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-decoration: none;
      transition: var(--transition);
      font-size: 0.85rem;
    }

    .project-links a:hover {
      background: var(--primary);
      color: var(--bg-dark);
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .project-card h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.6rem;
      color: var(--text-main);
      word-break: break-word;
    }

    .project-card p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.2rem;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .project-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .project-meta span {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .project-meta .lang-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
    }

    /* Loading skeleton */
    .skeleton {
      background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-card-hover) 50%, var(--bg-card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius);
      height: 230px;
    }

    /* Error / no repos */
    .load-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1.5rem;
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
    }

    .load-message i {
      font-size: 2.5rem;
      color: var(--primary);
      margin-bottom: 1rem;
      display: block;
    }

    .load-message .error-icon {
      color: #f87171;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    /* ============================================
       CONTACTO
       ============================================ */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: start;
    }

    .contact-info h3 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
    }

    .contact-info h3 span {
      color: var(--primary);
    }

    .contact-info > p {
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .contact-methods {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .contact-method {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.2rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--text-main);
      transition: var(--transition);
    }

    .contact-method:hover {
      border-color: var(--border-hover);
      transform: translateX(6px);
      background: var(--bg-card-hover);
    }

    .contact-method .method-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-size: 1.1rem;
      flex-shrink: 0;
      transition: var(--transition);
    }

    .contact-method:hover .method-icon {
      background: var(--primary);
      color: var(--bg-dark);
    }

    .method-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      display: block;
    }

    .method-value {
      font-weight: 600;
      font-size: 0.95rem;
      word-break: break-all;
    }

    /* Formulario */
    .contact-form {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      transition: var(--transition);
    }

    .contact-form:hover {
      border-color: var(--border-hover);
    }

    .form-group {
      margin-bottom: 1.3rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.85rem 1rem;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.92rem;
      transition: var(--transition);
      resize: vertical;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
    }

    .form-group textarea {
      min-height: 110px;
    }

    .form-submit {
      width: 100%;
      justify-content: center;
      margin-top: 0.5rem;
    }

    .form-feedback {
      margin-top: 1rem;
      font-size: 0.85rem;
      text-align: center;
      min-height: 1.4em;
      transition: var(--transition);
    }

    .form-feedback.success {
      color: var(--accent);
    }
    .form-feedback.error {
      color: #f87171;
    }

    /* ============================================
       FOOTER
       ============================================ */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 0;
      text-align: center;
    }

    .footer-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .footer-social {
      display: flex;
      gap: 0.8rem;
    }

    .footer-social a {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-decoration: none;
      transition: var(--transition);
    }

    .footer-social a:hover {
      background: var(--primary);
      color: var(--bg-dark);
      border-color: var(--primary);
      transform: translateY(-4px);
    }

    footer p {
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    footer p i {
      color: var(--primary);
    }

    /* ============================================
       RESPONSIVE
       ============================================ */
    @media (max-width: 900px) {
      .hero-grid {
        grid-template-columns: 1fr;
        gap: 3rem;
      }

      .hero-visual {
        max-width: 500px;
        margin: 0 auto;
        width: 100%;
      }

      .code-window {
        transform: none;
        animation: none;
      }

      .about-grid {
        grid-template-columns: 1fr;
        gap: 3rem;
        text-align: center;
      }

      .about-text p {
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }

      .contact-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 700px) {
      .nav-links {
        position: fixed;
        top: 0;
        right: -100%;
        width: 75%;
        max-width: 320px;
        height: 100vh;
        background: rgba(10, 14, 20, 0.98);
        backdrop-filter: blur(20px);
        flex-direction: column;
        justify-content: center;
        gap: 2rem;
        transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        border-left: 1px solid var(--border);
      }

      .nav-links.open {
        right: 0;
      }

      .nav-links a {
        font-size: 1.1rem;
      }

      .nav-toggle {
        display: block;
        z-index: 1001;
      }

      .about-info {
        grid-template-columns: 1fr;
      }

      section {
        padding: 3.5rem 0;
      }

      .hero {
        padding: 5rem 0 3rem;
      }

      .github-stats {
        gap: 0.6rem;
      }

      .stat-pill {
        font-size: 0.78rem;
        padding: 0.4rem 0.9rem;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 0 1rem;
      }

      .hero-cta {
        flex-direction: column;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }

      .projects-grid {
        grid-template-columns: 1fr;
      }

      .contact-form {
        padding: 1.5rem;
      }

      .avatar-frame {
        width: 180px;
        height: 180px;
      }

      .avatar-frame i {
        font-size: 4.5rem;
      }
    }

    /* Preferencias de movimiento reducido */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      html { scroll-behavior: auto; }
    }
  </style>
</head>
