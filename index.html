<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Álvaro García · DAM Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* ============ RESET Y VARIABLES ============ */
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg-dark:#0a0e14;
  --bg-card:#121821;
  --bg-card-hover:#182030;
  --primary:#38bdf8;
  --primary-glow:rgba(56,189,248,0.4);
  --secondary:#a78bfa;
  --accent:#34d399;
  --text-main:#f1f5f9;
  --text-muted:#94a3b8;
  --text-dim:#64748b;
  --border:rgba(255,255,255,0.06);
  --border-hover:rgba(56,189,248,0.35);
  --radius:18px;
  --radius-sm:12px;
  --transition:0.3s cubic-bezier(0.4,0,0.2,1);
}

html { scroll-behavior:smooth; }

body {
  font-family:'Inter',sans-serif;
  background-color:var(--bg-dark);
  color:var(--text-main);
  line-height:1.6;
  overflow-x:hidden;
  background-image:
    radial-gradient(circle at 15% 10%, rgba(56,189,248,0.07) 0%, transparent 30%),
    radial-gradient(circle at 85% 60%, rgba(167,139,250,0.07) 0%, transparent 35%);
  background-attachment:fixed;
}

::-webkit-scrollbar { width:8px; }
::-webkit-scrollbar-track { background:var(--bg-dark); }
::-webkit-scrollbar-thumb { background:var(--primary); border-radius:10px; }

/* ============ ANIMACIONES ============ */
@keyframes fadeInUp { from {opacity:0; transform:translateY(30px);} to {opacity:1; transform:translateY(0);} }
@keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
@keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
@keyframes pulseGlow {
  0%,100% { box-shadow:0 0 20px rgba(56,189,248,0.2); }
  50% { box-shadow:0 0 35px rgba(56,189,248,0.45); }
}
@keyframes shimmer {
  0% { background-position:-1000px 0; }
  100% { background-position:1000px 0; }
}
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes gradientShift {
  0%,100% { background-position:0% 50%; }
  50% { background-position:100% 50%; }
}
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }

/* ============ SISTEMA DE PÁGINAS (SPA) ============ */
.page { display:none; animation:fadeIn 0.5s ease both; }
.page.active { display:block; }

/* ============ NAVBAR ============ */
.navbar {
  position:fixed; top:0; left:0; right:0; z-index:1000;
  padding:1rem 0;
  background:rgba(10,14,20,0.75);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid transparent;
  transition:var(--transition);
}
.navbar.scrolled {
  border-bottom-color:var(--border);
  padding:0.7rem 0;
  box-shadow:0 4px 30px rgba(0,0,0,0.5);
}
.nav-content {
  max-width:1150px; margin:0 auto; padding:0 1.5rem;
  display:flex; justify-content:space-between; align-items:center;
}
.nav-logo {
  font-family:'JetBrains Mono',monospace;
  font-size:1.2rem; font-weight:600;
  color:var(--text-main); text-decoration:none;
  display:flex; align-items:center; gap:0.5rem;
  cursor:pointer; background:none; border:none;
}
.nav-logo span { color:var(--primary); }
.nav-logo .cursor {
  display:inline-block; width:2px; height:1.1em;
  background:var(--primary); margin-left:2px;
  animation:blink 1s step-end infinite;
}
.nav-links {
  display:flex; gap:2rem; list-style:none; align-items:center;
}
.nav-links a {
  color:var(--text-muted); text-decoration:none;
  font-size:0.9rem; font-weight:500;
  position:relative; transition:var(--transition); cursor:pointer;
}
.nav-links a::after {
  content:''; position:absolute;
  bottom:-6px; left:0; width:0; height:2px;
  background:var(--primary); transition:width var(--transition);
  border-radius:2px;
}
.nav-links a:hover { color:var(--primary); }
.nav-links a:hover::after { width:100%; }
.nav-toggle {
  display:none; background:none; border:none;
  color:var(--text-main); font-size:1.5rem;
  cursor:pointer; padding:0.3rem; z-index:1001;
}

/* ============ LAYOUT ============ */
.container { max-width:1150px; margin:0 auto; padding:0 1.5rem; }

/* ============ PÁGINA 1: LANDING DAM ============ */
.landing-wrap {
  max-width:1200px; margin:0 auto;
  padding:6rem 1.5rem 3rem;
  display:flex; flex-direction:column; gap:2.5rem;
}

.hero {
  background:rgba(19,26,38,0.8);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(56,189,248,0.2);
  border-radius:var(--radius);
  padding:2.5rem 2rem;
  display:flex; flex-wrap:wrap; align-items:center; gap:2.5rem;
  transition:var(--transition);
}
.hero:hover {
  border-color:rgba(56,189,248,0.4);
  box-shadow:0 0 30px -10px var(--primary-glow);
}
.hero-avatar {
  flex-shrink:0; width:140px; height:140px;
  background:linear-gradient(135deg,#1e293b,#0f172a);
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  border:4px solid var(--primary);
  box-shadow:0 0 30px rgba(56,189,248,0.3);
}
.hero-avatar i {
  font-size:5rem; color:var(--primary);
  filter:drop-shadow(0 0 8px rgba(56,189,248,0.6));
}
.hero-content { flex:1 1 300px; }
.hero-badge {
  display:inline-block;
  background:rgba(56,189,248,0.15);
  color:var(--primary); font-weight:600; font-size:0.85rem;
  padding:0.35rem 1rem; border-radius:50px;
  letter-spacing:0.5px; text-transform:uppercase;
  margin-bottom:1rem; border:1px solid rgba(56,189,248,0.3);
}
.hero h1 {
  font-size:2.8rem; font-weight:800; line-height:1.2;
  letter-spacing:-0.02em;
  background:linear-gradient(to right,#ffffff,#bae6fd);
  -webkit-background-clip:text; background-clip:text;
  color:transparent; margin-bottom:0.5rem;
}
.hero h2 {
  font-size:1.3rem; font-weight:400; color:var(--text-muted);
  margin-bottom:1.2rem;
  display:flex; align-items:center; gap:0.5rem;
}
.hero h2 i { color:var(--primary); font-size:1.2rem; }
.hero-description {
  color:#cbd5e1; font-size:1.05rem;
  margin-bottom:1.5rem; max-width:600px;
}

.cta-group { display:flex; flex-wrap:wrap; gap:1rem; align-items:center; }

.btn {
  display:inline-flex; align-items:center; justify-content:center;
  gap:0.6rem; padding:0.9rem 1.8rem; border-radius:50px;
  font-weight:600; font-size:0.95rem; text-decoration:none;
  transition:var(--transition); border:1px solid transparent;
  cursor:pointer; letter-spacing:0.3px; font-family:inherit;
}
.btn-primary {
  background:var(--primary); color:#0b0f17;
  box-shadow:0 8px 20px -6px rgba(56,189,248,0.5);
}
.btn-primary:hover {
  background:#7dd3fc; transform:translateY(-3px);
  box-shadow:0 15px 30px -8px rgba(56,189,248,0.7);
}
.btn-outline {
  background:transparent;
  border:1.5px solid rgba(56,189,248,0.5);
  color:var(--primary);
}
.btn-outline:hover {
  background:rgba(56,189,248,0.1);
  border-color:var(--primary); transform:translateY(-3px);
}

.section-title {
  font-size:1.8rem; font-weight:700; margin-bottom:1.5rem;
  display:flex; align-items:center; gap:0.75rem;
  letter-spacing:-0.02em;
}
.section-title i { color:var(--primary); font-size:1.8rem; }
.section-title span {
  background:linear-gradient(to right,#ffffff,#bae6fd);
  -webkit-background-clip:text; background-clip:text;
  color:transparent;
}

/* SKILLS landing */
.skills-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:1.2rem;
}
.skill-card {
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:1.6rem 1rem;
  display:flex; flex-direction:column; align-items:center;
  text-align:center; transition:var(--transition);
}
.skill-card:hover {
  border-color:rgba(56,189,248,0.4);
  background:#172032; transform:translateY(-5px);
  box-shadow:0 20px 25px -12px rgba(0,0,0,0.6);
}
.skill-card i {
  font-size:2.4rem; margin-bottom:0.8rem;
  color:var(--primary);
  filter:drop-shadow(0 0 5px rgba(56,189,248,0.4));
}
.skill-card .skill-name { font-weight:600; font-size:1rem; margin-bottom:0.25rem; }
.skill-card .skill-level {
  font-size:0.8rem; color:var(--text-muted);
  background:rgba(255,255,255,0.05);
  padding:0.15rem 0.8rem; border-radius:50px;
}

/* PROYECTOS landing */
.projects-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:1.8rem;
}
.project-card {
  background:var(--bg-card);
  border-radius:var(--radius-sm);
  padding:1.8rem 1.5rem;
  border:1px solid var(--border);
  transition:var(--transition);
  display:flex; flex-direction:column;
  position:relative; overflow:hidden;
}
.project-card:hover {
  border-color:rgba(56,189,248,0.4);
  transform:translateY(-6px);
  box-shadow:0 22px 30px -14px rgba(0,0,0,0.7);
}
.project-card.clickable { cursor:pointer; }
.project-card.clickable::after {
  content:''; position:absolute;
  top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg,var(--primary),var(--secondary));
  transform:scaleX(0); transform-origin:left;
  transition:transform var(--transition);
}
.project-card.clickable:hover::after { transform:scaleX(1); }

.project-icon {
  font-size:2.2rem; color:var(--secondary);
  margin-bottom:1rem;
}
.project-card h3 {
  font-size:1.35rem; font-weight:700;
  margin-bottom:0.5rem; letter-spacing:-0.01em;
}
.project-card p {
  color:#cbd5e1; font-size:0.95rem;
  margin-bottom:1.2rem; flex:1;
}

.tech-tags { display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:auto; }
.tech-tags span {
  background:rgba(56,189,248,0.1);
  color:#bae6fd; font-size:0.75rem; font-weight:600;
  padding:0.25rem 0.8rem; border-radius:50px;
  border:1px solid rgba(56,189,248,0.2);
}

.live-badge {
  position:absolute; top:1rem; right:1rem;
  background:var(--accent); color:#0b0f17;
  font-size:0.7rem; font-weight:700;
  padding:0.25rem 0.7rem; border-radius:50px;
  display:flex; align-items:center; gap:0.3rem;
  box-shadow:0 0 15px rgba(52,211,153,0.5);
}
.live-badge i { font-size:0.5rem; }

/* Contacto landing */
.contact-section {
  background:linear-gradient(145deg,#0f1621,#0b0f17);
  border-radius:var(--radius);
  padding:2.5rem 2rem;
  border:1px solid rgba(56,189,248,0.15);
  display:flex; flex-wrap:wrap;
  align-items:center; justify-content:space-between;
  gap:2rem;
}
.contact-text h3 {
  font-size:1.6rem; font-weight:700; margin-bottom:0.5rem;
  display:flex; align-items:center; gap:0.6rem;
}
.contact-text h3 i { color:var(--primary); }
.contact-text p { color:var(--text-muted); max-width:400px; }
.contact-links { display:flex; flex-wrap:wrap; gap:1rem; }
.contact-btn {
  background:rgba(56,189,248,0.08);
  border:1px solid rgba(56,189,248,0.25);
  border-radius:60px; padding:0.8rem 1.6rem;
  display:inline-flex; align-items:center; gap:0.6rem;
  color:var(--text-main); text-decoration:none;
  font-weight:500; transition:var(--transition); font-size:0.95rem;
}
.contact-btn i { color:var(--primary); font-size:1.2rem; }
.contact-btn:hover {
  background:rgba(56,189,248,0.2);
  border-color:var(--primary); transform:translateY(-3px);
}

/* ============ PÁGINA 2: DEVPORTFOLIO ============ */
.dev-wrap { padding-top:5rem; }

.dev-hero {
  min-height:90vh;
  display:flex; align-items:center;
  padding:4rem 0;
}
.dev-hero-grid {
  display:grid; grid-template-columns:1fr 1fr;
  gap:4rem; align-items:center; width:100%;
}
.dev-hero-text { animation:fadeInUp 0.8s ease both; }

.hero-status {
  display:inline-flex; align-items:center; gap:0.6rem;
  background:rgba(52,211,153,0.1);
  border:1px solid rgba(52,211,153,0.3);
  color:var(--accent); font-size:0.8rem; font-weight:600;
  padding:0.4rem 1rem; border-radius:50px;
  margin-bottom:1.5rem; letter-spacing:0.3px;
}
.hero-status .dot {
  width:8px; height:8px; background:var(--accent);
  border-radius:50%; box-shadow:0 0 10px var(--accent);
  animation:pulseGlow 2s infinite;
}
.dev-hero h1 {
  font-size:clamp(2.2rem,5vw,3.5rem);
  font-weight:800; line-height:1.1;
  letter-spacing:-0.03em; margin-bottom:1rem;
}
.dev-hero h1 .gradient {
  background:linear-gradient(120deg,var(--primary),var(--secondary),var(--accent));
  background-size:200% auto;
  -webkit-background-clip:text; background-clip:text;
  color:transparent; animation:gradientShift 5s ease infinite;
}
.hero-subtitle {
  font-family:'JetBrains Mono',monospace;
  font-size:1rem; color:var(--primary);
  margin-bottom:1.5rem; min-height:1.6em;
}
.hero-subtitle .type-cursor {
  display:inline-block; width:2px; height:1.1em;
  background:var(--primary); margin-left:3px;
  animation:blink 1s step-end infinite;
}
.dev-hero .hero-description {
  color:var(--text-muted); font-size:1.05rem;
  max-width:500px; margin-bottom:2rem;
}

/* Code window */
.code-window {
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:0 0 60px -20px var(--primary-glow);
  transition:var(--transition);
  animation:float 6s ease-in-out infinite;
}
.code-window:hover {
  transform:translateY(-5px);
  box-shadow:0 20px 40px -12px rgba(0,0,0,0.7),
             0 0 80px -20px var(--primary-glow);
}
.window-header {
  display:flex; align-items:center; gap:0.5rem;
  padding:0.8rem 1rem;
  background:rgba(0,0,0,0.3);
  border-bottom:1px solid var(--border);
}
.window-dot { width:12px; height:12px; border-radius:50%; }
.dot-red { background:#ff5f56; }
.dot-yellow { background:#ffbd2e; }
.dot-green { background:#27c93f; }
.window-title {
  margin-left:auto;
  font-family:'JetBrains Mono',monospace;
  font-size:0.75rem; color:var(--text-dim);
}
.window-body {
  padding:1.5rem;
  font-family:'JetBrains Mono',monospace;
  font-size:0.85rem; line-height:1.8;
  overflow-x:auto;
}
.code-line { display:block; white-space:pre; }
.code-keyword { color:#c084fc; }
.code-string { color:#86efac; }
.code-function { color:#38bdf8; }
.code-comment { color:#64748b; font-style:italic; }
.code-var { color:#fbbf24; }
.code-bool { color:#f472b6; }

/* Secciones dev */
.dev-section { padding:4rem 0; }
.section-header { text-align:center; margin-bottom:3rem; }
.section-tag {
  font-family:'JetBrains Mono',monospace;
  font-size:0.85rem; color:var(--primary);
  margin-bottom:0.8rem; display:block; letter-spacing:1px;
}
.dev-section .section-title {
  font-size:clamp(1.8rem,4vw,2.5rem);
  font-weight:800; letter-spacing:-0.02em;
  margin-bottom:1rem; display:block; text-align:center;
}
.section-desc {
  color:var(--text-muted); max-width:600px;
  margin:0 auto; font-size:1rem;
}
.section-line {
  width:60px; height:3px;
  background:linear-gradient(90deg,var(--primary),var(--secondary));
  margin:1.2rem auto 0; border-radius:3px;
}

/* About dev */
.about-grid {
  display:grid; grid-template-columns:1fr 1.3fr;
  gap:4rem; align-items:center;
}
.about-avatar { display:flex; justify-content:center; }
.avatar-frame {
  width:240px; height:240px;
  border-radius:30% 70% 70% 30% / 30% 30% 70% 70%;
  background:linear-gradient(135deg,var(--primary),var(--secondary),var(--accent));
  display:flex; align-items:center; justify-content:center;
  animation:float 7s ease-in-out infinite;
  box-shadow:0 20px 60px -15px var(--primary-glow);
  position:relative;
}
.avatar-frame::before {
  content:''; position:absolute; inset:6px;
  background:var(--bg-card); border-radius:inherit;
}
.avatar-frame i {
  font-size:6rem; color:var(--primary);
  position:relative; z-index:1;
  filter:drop-shadow(0 0 15px var(--primary-glow));
}
.about-text h3 {
  font-size:1.6rem; font-weight:700; margin-bottom:1rem;
}
.about-text h3 span { color:var(--primary); }
.about-text p {
  color:var(--text-muted); margin-bottom:1.2rem; font-size:1rem;
}
.about-info {
  display:grid; grid-template-columns:repeat(2,1fr);
  gap:1rem; margin-top:1.8rem;
}
.info-item {
  display:flex; align-items:center; gap:0.8rem;
  padding:0.8rem 1rem;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  transition:var(--transition);
}
.info-item:hover {
  border-color:var(--border-hover); transform:translateY(-3px);
}
.info-item i {
  color:var(--primary); font-size:1.2rem;
  width:24px; text-align:center;
}
.info-item .info-label {
  font-size:0.75rem; color:var(--text-dim); display:block;
}
.info-item .info-value {
  font-size:0.9rem; font-weight:600; color:var(--text-main);
}

/* Skills dev con barras */
.dev-skills-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:1.2rem;
}
.dev-skill-card {
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:1.8rem 1.2rem;
  text-align:center; transition:var(--transition);
  position:relative; overflow:hidden;
}
.dev-skill-card:hover {
  border-color:var(--border-hover);
  transform:translateY(-6px);
  box-shadow:0 20px 40px -12px rgba(0,0,0,0.7);
}
.dev-skill-card i {
  font-size:2.6rem; margin-bottom:0.9rem;
  color:var(--primary); transition:var(--transition);
}
.dev-skill-card:hover i {
  transform:scale(1.15) rotate(-5deg); color:var(--secondary);
}
.dev-skill-card .skill-name {
  font-weight:700; font-size:1rem; margin-bottom:0.6rem;
}
.skill-bar {
  height:5px; background:rgba(255,255,255,0.06);
  border-radius:10px; overflow:hidden; margin-top:0.8rem;
}
.skill-bar-fill {
  height:100%; border-radius:10px;
  background:linear-gradient(90deg,var(--primary),var(--secondary));
  width:0; transition:width 1.2s cubic-bezier(0.4,0,0.2,1);
}

/* GitHub stats */
.github-stats {
  display:flex; flex-wrap:wrap;
  justify-content:center; gap:1rem;
  margin-bottom:2.5rem;
}
.stat-pill {
  display:inline-flex; align-items:center; gap:0.5rem;
  background:var(--bg-card);
  border:1px solid var(--border);
  padding:0.5rem 1.2rem; border-radius:50px;
  font-size:0.85rem; color:var(--text-muted);
  transition:var(--transition);
}
.stat-pill i { color:var(--primary); }
.stat-pill strong { color:var(--text-main); }
.stat-pill:hover {
  border-color:var(--border-hover); transform:translateY(-2px);
}

/* Proyectos GitHub API */
.dev-projects-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:1.5rem;
}
.dev-project-card {
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:1.6rem;
  transition:var(--transition);
  display:flex; flex-direction:column;
  position:relative; overflow:hidden;
}
.dev-project-card:hover {
  border-color:var(--border-hover);
  background:var(--bg-card-hover);
  transform:translateY(-6px);
  box-shadow:0 20px 40px -12px rgba(0,0,0,0.7);
}
.dev-project-top {
  display:flex; justify-content:space-between;
  align-items:flex-start; margin-bottom:1rem;
}
.dev-project-icon {
  width:48px; height:48px; border-radius:12px;
  background:rgba(56,189,248,0.1);
  border:1px solid rgba(56,189,248,0.2);
  display:flex; align-items:center; justify-content:center;
  color:var(--primary); font-size:1.3rem;
}
.dev-project-links { display:flex; gap:0.5rem; }
.dev-project-links a {
  width:34px; height:34px; border-radius:9px;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  color:var(--text-muted); text-decoration:none;
  transition:var(--transition); font-size:0.85rem;
}
.dev-project-links a:hover {
  background:var(--primary); color:var(--bg-dark);
  border-color:var(--primary); transform:translateY(-2px);
}
.dev-project-card h3 {
  font-size:1.15rem; font-weight:700;
  margin-bottom:0.6rem; word-break:break-word;
}
.dev-project-card p {
  color:var(--text-muted); font-size:0.9rem;
  margin-bottom:1.2rem; flex:1;
  display:-webkit-box; -webkit-line-clamp:3;
  -webkit-box-orient:vertical; overflow:hidden;
}
.project-meta {
  display:flex; flex-wrap:wrap; gap:1rem;
  padding-top:1rem; border-top:1px solid var(--border);
  font-size:0.8rem; color:var(--text-dim);
}
.project-meta span {
  display:inline-flex; align-items:center; gap:0.4rem;
}
.project-meta .lang-dot {
  width:10px; height:10px; border-radius:50%;
  background:var(--primary);
}

.skeleton {
  background:linear-gradient(90deg,var(--bg-card) 25%,var(--bg-card-hover) 50%,var(--bg-card) 75%);
  background-size:200% 100%;
  animation:shimmer 1.5s infinite;
  border-radius:var(--radius);
  height:230px;
}
.load-message {
  grid-column:1/-1;
  text-align:center; padding:3rem 1.5rem;
  background:var(--bg-card);
  border:1px dashed var(--border);
  border-radius:var(--radius);
  color:var(--text-muted);
}
.load-message i {
  font-size:2.5rem; color:var(--primary);
  margin-bottom:1rem; display:block;
}
.spinner {
  width:40px; height:40px;
  border:3px solid var(--border);
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin 0.8s linear infinite;
  margin:0 auto 1rem;
}

/* Volver */
.back-bar {
  position:fixed;
  bottom:1.5rem; right:1.5rem;
  z-index:999;
}
.back-btn {
  background:var(--primary);
  color:var(--bg-dark);
  border:none; border-radius:50px;
  padding:0.85rem 1.5rem;
  font-weight:600; font-size:0.9rem;
  cursor:pointer; display:inline-flex;
  align-items:center; gap:0.6rem;
  box-shadow:0 10px 30px -8px var(--primary-glow);
  transition:var(--transition);
  font-family:inherit;
}
.back-btn:hover {
  background:#7dd3fc; transform:translateY(-3px);
  box-shadow:0 15px 35px -8px var(--primary-glow);
}

/* Footer */
footer {
  border-top:1px solid var(--border);
  padding:2rem 0; text-align:center;
  margin-top:3rem;
}
footer p { color:var(--text-dim); font-size:0.85rem; }
footer p i { color:var(--primary); }

/* ============ RESPONSIVE ============ */
@media (max-width:900px) {
  .dev-hero-grid { grid-template-columns:1fr; gap:3rem; }
  .dev-hero-visual { max-width:500px; margin:0 auto; width:100%; }
  .about-grid { grid-template-columns:1fr; gap:3rem; text-align:center; }
  .about-info { justify-items:center; }
}

@media (max-width:700px) {
  .nav-links {
    position:fixed; top:0; right:-100%;
    width:75%; max-width:320px; height:100vh;
    background:rgba(10,14,20,0.98);
    backdrop-filter:blur(20px);
    flex-direction:column; justify-content:center;
    gap:2rem; transition:right 0.4s ease;
    border-left:1px solid var(--border);
  }
  .nav-links.open { right:0; }
  .nav-links a { font-size:1.1rem; }
  .nav-toggle { display:block; }
  .about-info { grid-template-columns:1fr; }
  .landing-wrap { padding:5rem 1rem 3rem; }
  .hero h1 { font-size:2.2rem; }
}

@media (max-width:480px) {
  .hero { flex-direction:column; text-align:center; }
  .hero h2 { justify-content:center; }
  .cta-group { justify-content:center; width:100%; }
  .btn { width:100%; }
  .skills-grid { grid-template-columns:repeat(2,1fr); }
  .avatar-frame { width:180px; height:180px; }
  .avatar-frame i { font-size:4.5rem; }
  .contact-section { flex-direction:column; text-align:center; }
}
</style>
